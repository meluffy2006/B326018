<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rover Status | Safety Rover</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../Dashboard/dashboard.css">
<link rel="stylesheet" href="../RoverStatus/rover-status.css">
</head>
<body>
<div class="shell">
  <div id="navbar-slot"></div>
  <div id="sidebar-slot"></div>
  <main class="shell-main">
    <div class="grid">
      <section class="s5" id="health">
        <h2>🔋 Rover Health</h2>
        <div class="kv"><span>Battery</span><b id="rhBat">--</b></div>
        <div class="kv"><span>Connection (Wi-Fi)</span><b id="rhNet">--</b></div>
        <div class="kv"><span>Motors (4-wheel track)</span><b id="rhMot">OK</b></div>
        <div class="kv"><span>Camera</span><b id="rhCam">OK</b></div>
        <div class="kv"><span>Thermal sensor</span><b id="rhTh">OK</b></div>
        <div class="kv"><span>Processor load (Pi)</span><b id="rhCpu">--</b></div>
      </section>

      <section class="s7" id="map">
        <h2>🗺️ Live Map <small id="pos">--</small></h2>
        <canvas class="map-canvas" id="mapc" width="520" height="390"></canvas>
        <a class="maplink" href="../Maps/maps.html">Open full GPS map &rarr;</a>
      </section>
    </div>
    <footer>Smarter Inspection &nbsp;|&nbsp; Safer Operations &nbsp;|&nbsp; Affordable Innovation</footer>
  </main>
</div>

<script src="../assets/js/core.js"></script>
<script src="../CameraMonitor/camera-monitor.js"></script>
<script src="../SensorData/sensor-data.js"></script>
<script src="../Alerts/alerts.js"></script>
<script src="../RoverStatus/rover-status.js"></script>
<script src="../Dashboard/dashboard.js"></script>
</body>
</html>
