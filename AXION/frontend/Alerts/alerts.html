<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alerts | Safety Rover</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../Dashboard/dashboard.css">
<link rel="stylesheet" href="../Alerts/alerts.css">
</head>
<body>
<div class="shell">
  <div id="navbar-slot"></div>
  <div id="sidebar-slot"></div>
  <main class="shell-main">
    <div class="grid">
      <section class="s7" id="alerts">
        <h2>🚨 Alerts <small>suspicious / anomaly detection</small></h2>
        <div class="list" id="alertList"></div>
        <div class="ctrl"><button id="simAlert">Simulate anomaly</button><button id="buzz">🔔 Test buzzer</button></div>
      </section>

      <section class="s5 human" id="human">
        <h2>👮 Human Verification</h2>
        <div class="sel-box" id="selBox">Select an alert to review it.</div>
        <div class="ctrl">
          <button class="ok" id="confirm" disabled>Confirm threat</button>
          <button class="bad" id="false" disabled>Mark false alarm</button>
          <button id="escal" disabled>Escalate to control room</button>
        </div>
        <div class="kv" style="margin-top:10px"><span>Verified today</span><b id="vCount">0</b></div>
      </section>

      <section class="s12" id="evid">
        <h2>🕘 Event history <small>latest 30 events</small></h2>
        <div class="list" id="history" style="max-height:260px"></div>
      </section>
    </div>
    <footer>Smarter Inspection &nbsp;|&nbsp; Safer Operations &nbsp;|&nbsp; Affordable Innovation</footer>
  </main>
</div>

<script src="../assets/js/core.js"></script>
<script src="../CameraMonitor/camera-monitor.js"></script>
<script src="../SensorData/sensor-data.js"></script>
<script src="../Alerts/alerts.js"></script>
<script src="../RoverStatus/rover-status.js"></script>
<script src="../Dashboard/dashboard.js"></script>
</body>
</html>
