<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Camera Monitor | Safety Rover</title>

    <link rel="icon" href="/favicon.ico">

    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../Dashboard/dashboard.css">
    <link rel="stylesheet" href="../CameraMonitor/camera-monitor.css">
</head>

<body>

<div class="shell">

    <div id="navbar-slot"></div>
    <div id="sidebar-slot"></div>

    <main class="shell-main">

        <div class="grid">

            <!-- LIVE CAMERA -->
            <section class="s7" id="cam">

                <h2>
                    📹 Live Camera
                    <small id="camMode">
                        Normal view &middot; Coach B, Zone 3
                    </small>
                </h2>

                <div class="camwrap">

                    <!-- Exact ESP32 URL provided -->
                    <iframe
                        class="feed"
                        id="feed"
                        src="http://10.119.183.243"
                        title="AXION ESP32 Live Camera"
                        allowfullscreen
                    ></iframe>

                    <div class="rec">
                        <b>●</b>
                        <span id="cameraStatus">CAMERA</span>
                    </div>

                    <div class="ts" id="camTs"></div>

                </div>

                <!-- CAMERA CONTROLS -->
                <div class="ctrl">

                    <button
                        class="on"
                        data-mode="normal"
                        type="button"
                    >
                        Normal
                    </button>

                    <button
                        data-mode="thermal"
                        type="button"
                    >
                        Thermal
                    </button>

                    <button
                        data-mode="night"
                        type="button"
                    >
                        Low-light
                    </button>

                    <button
                        id="lights"
                        class="on"
                        type="button"
                    >
                        LED lights: on
                    </button>

                    <button
                        id="snapBtn"
                        type="button"
                    >
                        📸 Capture snapshot
                    </button>

                    <button
                        id="reconnectBtn"
                        type="button"
                    >
                        🔄 Reconnect
                    </button>

                </div>

                <p class="camera-note" id="cameraNote">
                    Camera source: http://10.119.183.243
                </p>

            </section>

            <!-- EVIDENCE -->
            <section class="s5" id="evid">

                <h2>
                    📸 Evidence
                    <small>Snapshots + event history</small>
                </h2>

                <div class="snaps" id="snaps"></div>

                <div
                    class="list"
                    id="history"
                    style="max-height:170px"
                ></div>

            </section>

        </div>

        <footer>
            Smarter Inspection &nbsp;|&nbsp;
            Safer Operations &nbsp;|&nbsp;
            Affordable Innovation
        </footer>

    </main>

</div>

<script src="../assets/js/core.js"></script>
<script src="../CameraMonitor/camera-monitor.js"></script>
<script src="../SensorData/sensor-data.js"></script>
<script src="../Alerts/alerts.js"></script>
<script src="../RoverStatus/rover-status.js"></script>
<script src="../Dashboard/dashboard.js"></script>

</body>
</html>
